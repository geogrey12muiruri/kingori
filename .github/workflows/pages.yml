name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'docs/' \
            --exclude '_site/' \
            --exclude 'siteplan.html' \
            --exclude 'styles/siteplan.css' \
            --exclude 'images/wireframes/' \
            --exclude 'scripts/conversations/*.mjs' \
            --exclude 'scripts/conversations/editorial-overrides.json' \
            --exclude 'scripts/conversations/youtube-cache.json' \
            --exclude 'scripts/conversations/README.md' \
            ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
